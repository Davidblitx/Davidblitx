name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"  # Every 12 hours
  workflow_dispatch:        # Allows you to trigger it manually

permissions:
  contents: write           # Explicitly grants write permissions to the token

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4   # Upgraded from v2
      
      - uses: Platane/snk@v3        # Upgraded to v3 (fixes Node and set-output warnings)
        with:
          github_user_name: Davidblitx
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4  # Upgraded from v2
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
